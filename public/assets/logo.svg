<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="100%" height="100%">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ICON: Quantum Portal (Orbit Rings + Verification Core) -->
  <g transform="translate(25, 18)">
    <ellipse cx="45" cy="45" rx="38" ry="16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" transform="rotate(-25 45 45)"/>
    <ellipse cx="45" cy="45" rx="38" ry="16" fill="none" stroke="url(#portalGrad)" stroke-width="3" transform="rotate(35 45 45)" filter="url(#glowP)"/>
    <polygon points="45,22 65,45 45,68 25,45" fill="#09090b" stroke="url(#portalGrad)" stroke-width="2.5"/>
    <path d="M 36 45 L 42 52 L 54 38" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowP)"/>
    <circle cx="16" cy="24" r="3.5" fill="#00f2fe" filter="url(#glowP)"/>
    <circle cx="74" cy="66" r="3.5" fill="#ec4899"/>
  </g>

  <!-- TYPOGRAPHY: markiv.site -->
  <g transform="translate(140, 72)">
    <text x="0" y="0" fill="#ffffff" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="44" font-weight="900" letter-spacing="-1">mark</text>
    <text x="120" y="0" fill="url(#portalGrad)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="44" font-weight="900" filter="url(#glowP)">iv</text>
    <text x="178" y="-14" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">.site</text>
    <line x1="0" y1="14" x2="380" y2="14" stroke="#27272a" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="160" y2="14" stroke="url(#portalGrad)" stroke-width="2.5"/>
    <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="3">AI TRUTH &bull; P2P AIR DROP</text>
  </g>
</svg>
